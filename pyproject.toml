[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "babybubblebabble-verifier"
version = "1.0.0"
description = "Receipt verifier backend for Baby Bubble Babble"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyjwt>=2.8.0",
  "cryptography>=42.0.0",
  "google-api-python-client>=2.121.0",
  "google-auth>=2.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["server"]
